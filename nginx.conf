server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # No revelar la versión de nginx
    server_tokens off;

    # ── Compresión ────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/rss+xml
                      image/svg+xml;

    # ── Cabeceras de seguridad ────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # HSTS solo tiene sentido detrás de HTTPS; descoméntalo cuando tengas
    # el certificado en marcha y hayas comprobado que todo carga por https.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Caché ─────────────────────────────────────────────────────
    # Los assets de Astro llevan hash en el nombre: se pueden cachear para
    # siempre porque un cambio genera un nombre distinto.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # El HTML nunca se cachea: es lo que permite que un despliegue
    # se vea inmediatamente.
    location ~* \.(html|xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Rutas ─────────────────────────────────────────────────────
    # Astro genera /articulo/index.html, así que basta con probar el
    # directorio. Nada de fallback a index.html: es un sitio estático,
    # no una SPA, y un 404 debe ser un 404 para que Google lo entienda.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
